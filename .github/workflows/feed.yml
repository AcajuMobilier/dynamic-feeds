name: Feeduri marketplace

on:
  # La fiecare 2 ore. Minutul 20, nu 0: fix la ora fixă GitHub e cel mai aglomerat
  # și rulările programate întârzie sau se pierd.
  schedule:
    - cron: "20 */2 * * *"
  # Butonul „Run workflow" din tabul Actions.
  workflow_dispatch:
    inputs:
      feeduri:
        description: "Ce feeduri (nume separate prin virgulă, ex. oceanfavi,acajufavi). Gol = toate"
        type: string
        default: ""
      fara_frana:
        description: "Publică chiar dacă frâna de siguranță ar opri un feed"
        type: boolean
        default: false
      limita:
        description: "Oprește după N produse per magazin (doar pentru testarea frânei; 0 = fără limită)"
        type: string
        default: "0"
  # La orice modificare de cod sau configurare pe ramura principală.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "genereaza.py"
      - "requirements.txt"
      - ".github/workflows/feed.yml"

# Implicit, niciun job nu are drepturi. Fiecare job cere doar ce îi trebuie.
permissions: {}

# O singură publicare o dată. Rulările din coadă se aruncă, dar cea în curs
# se lasă să se termine, ca să nu rămână Pages într-o stare incompletă.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  genereaza:
    name: Generează și validează feedurile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Ia codul din repo
        uses: actions/checkout@v7.0.1

      - name: Pregătește Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Instalează dependențele
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rulează testele
        run: python -m pytest tests -q

      - name: Generează feedurile
        env:
          # Un magazin = o pereche de secrete. Numele variabilelor sunt în
          # config/magazine.yaml; aici doar se transmit din Secrets.
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE_ACAJU: ${{ secrets.SHOPIFY_STORE_ACAJU }}
          SHOPIFY_TOKEN_ACAJU: ${{ secrets.SHOPIFY_TOKEN_ACAJU }}
          # Opțiunile din butonul de rulare manuală ajung aici ca variabile de
          # mediu, nu direct în comandă: altfel textul scris de om ar fi
          # executat de shell.
          FEEDURI: ${{ inputs.feeduri }}
          FARA_FRANA: ${{ inputs.fara_frana }}
          LIMITA: ${{ inputs.limita }}
        run: |
          set -euo pipefail
          ARGUMENTE=()
          if [ "${FARA_FRANA:-false}" = "true" ]; then
            ARGUMENTE+=(--fara-frana)
            echo "::warning::Frâna de siguranță a fost dezactivată manual pentru această rulare."
          fi
          if [ -n "${LIMITA:-}" ] && [ "${LIMITA}" != "0" ]; then
            case "$LIMITA" in
              ''|*[!0-9]*) echo "::error::Limita trebuie să fie un număr întreg."; exit 1 ;;
            esac
            ARGUMENTE+=(--limita "$LIMITA")
            echo "::warning::Rulare limitată artificial la $LIMITA produse per magazin."
          fi
          if [ -n "${FEEDURI:-}" ]; then
            IFS=',' read -ra LISTA <<< "$FEEDURI"
            for f in "${LISTA[@]}"; do
              f="$(echo "$f" | tr -d '[:space:]')"
              case "$f" in
                ''|*[!a-z0-9_-]*) echo "::error::Nume de feed invalid: $f"; exit 1 ;;
              esac
              ARGUMENTE+=(--feed "$f")
            done
          fi
          # Feedurile merg în „public" (se publică pe Pages), rapoartele în
          # „raport" (rămân private, se descarcă doar din pagina rulării).
          # Un feed care pică nu oprește restul: pentru el se păstrează
          # versiunea aflată live. Cod 7 = folder incomplet, nu se publică.
          python genereaza.py --iesire public --iesire-raport raport "${ARGUMENTE[@]}"

      - name: Adaugă pagina de index
        run: python scripts/scrie_index.py public

      - name: Păstrează rapoartele, fără să le publice
        # Rapoartele conțin titluri și numere de produse nepublicate sau
        # arhivate, deci nu au ce căuta la o adresă publică. Se descarcă din
        # pagina rulării, de la secțiunea „Artifacts", doar de cine are acces
        # la repo. Se păstrează 30 de zile.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rapoarte
          path: raport
          retention-days: 30
          if-no-files-found: warn

      - name: Pregătește GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Încarcă feedurile pentru publicare
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public
          retention-days: 7

  publica:
    name: Publică pe GitHub Pages
    needs: genereaza
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicare.outputs.page_url }}
    steps:
      - name: Publică
        id: publicare
        uses: actions/deploy-pages@v5.0.1

      - name: Scrie adresa în rezumat
        run: |
          {
            echo "## Publicat"
            echo ""
            echo "Toate feedurile sunt la ${{ steps.publicare.outputs.page_url }} (lista completă pe pagina de index)."
            echo ""
            echo "Publicarea poate dura până la 10 minute până se vede la adresă."
          } >> "$GITHUB_STEP_SUMMARY"

  verifica:
    name: Semnalează feedurile picate
    # Rulează DUPĂ publicare: feedurile bune ajung online oricum, iar dacă
    # vreunul a picat, rularea se face roșie și primești mail.
    needs: [genereaza, publica]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Ia codul din repo
        uses: actions/checkout@v7.0.1
      - name: Ia starea generării
        uses: actions/download-artifact@v7.0.0
        with:
          name: github-pages
          path: pagina
      - name: Verifică starea fiecărui feed
        run: |
          set -euo pipefail
          tar -xf pagina/artifact.tar -C pagina stare.json
          python scripts/verifica_stare.py pagina/stare.json
