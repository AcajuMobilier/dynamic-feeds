# Feedul Favi.ro pentru acaju.ro. Înlocuiește feedul Mulwi „1yc0-heureka"
# (care era de fapt în format Google). Format Heureka, generat de motorul nostru.
magazin: acaju
format: favi
fisier: "acajufavi.xml"

# POLITICA DE ID — moștenită din feedul Mulwi aflat live pe Favi: ID de PRODUS,
# un item per produs (verificat pe toate cele 3690 de ID-uri, 2026-09-23).
# Prețul, stocul și greutatea vin de la prima variantă (după poziție).
id: produs

selectie:
  tag: "FAVI"
  doar_publicate: true
  exclude_fara_stoc: false

# Setări ale motorului Heureka (Favi). Aceleași pentru toate feedurile Favi.
favi:
  producator:
    # nimic | branduri_reale | ocean   (ce se trimite la MANUFACTURER)
    mod: "nimic"
    branduri_reale: ['KONDELA', 'FORTE', 'FURNIVAL']
  descriere:
    taguri_permise: ['p', 'b', 'strong', 'i', 'em', 'br', 'ul', 'li', 'ol']
    # Scaunele au doar „Culoare șezut"; o ridicăm și ca „Culoare" pentru filtrul Favi.
    deriva_culoare: true
  imagini:
    max_alternative: 20
    latime_minima: 600
    inaltime_minima: 600
