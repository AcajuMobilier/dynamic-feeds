# Configurarea magazinului ocean.ro pentru canalul Favi.
# Acesta e singurul fișier pe care îl modifici în mod normal.
# Pentru al doilea magazin (acaju.ro) se copiază acest fișier și se schimbă valorile.

magazin:
  nume: "ocean.ro"
  # Handle-ul .myshopify.com vine din variabila de mediu SHOPIFY_STORE (secret),
  # nu se scrie aici.

selectie:
  # Un produs intră în feed DOAR dacă are acest tag în Shopify (potrivire exactă,
  # indiferent de majuscule). Ca să schimbi tagul, schimbi rândul de mai jos.
  tag: "OCEANFAVI"
  # Produsele tagate rămân în feed și când stocul e 0 — se scot manual, din tag.
  exclude_fara_stoc: false

livrare:
  # DELIVERY_DATE = zile până la expediere. Favi arată „în stoc" pentru 0–3.
  zile_in_stoc: 2
  zile_fara_stoc: 30
  # Tagurile Shopify au prioritate față de stoc.
  dupa_tag:
    livrare14zile: 14
  # Elementul DELIVERY: prețul se calculează din greutatea variantei,
  # pe grila GLS din Shopify Shipping. Perechi [limită_kg, preț_lei];
  # primul prag >= greutate dă prețul.
  curier: "GLS"
  preturi_kg:
    - [0.1, 0]
    - [3, 35]
    - [5, 39]
    - [10, 49]
    - [15, 59]
    - [20, 79]
    - [25, 89]
    - [31, 119]
    - [35, 129]
    - [50, 139]
    - [70, 169]
    - [100, 199]
    - [200, 249]
    - [300, 299]
    - [99999, 399]

producator:
  # Ce se trimite la MANUFACTURER (element opțional la Favi):
  #   nimic          -> nu se trimite deloc
  #   branduri_reale -> doar brandurile din lista de mai jos
  #   ocean          -> brandurile reale își păstrează numele, restul primesc „Ocean"
  mod: "nimic"
  branduri_reale: ["KONDELA", "FORTE", "FURNIVAL"]

descriere:
  # Singurele taguri HTML acceptate de Favi.
  taguri_permise: ["p", "b", "strong", "i", "em", "br", "ul", "li", "ol"]
  # Scaunele au doar „Culoare șezut"; o ridicăm și ca „Culoare" pentru filtrul Favi.
  deriva_culoare: true

imagini:
  # Favi acceptă maximum 20 de imagini alternative pe lângă cea principală.
  max_alternative: 20
  # Sub această dimensiune Favi poate bloca afișarea produsului. Doar raportăm.
  latime_minima: 600
  inaltime_minima: 600

publicare:
  # Numele fișierelor publicate pe GitHub Pages.
  fisier_feed: "oceanfavi.xml"
  fisier_raport: "raport.csv"
  # Frâna de siguranță: dacă noul feed are sub acest procent din numărul de
  # produse al feedului aflat LIVE, publicarea se oprește cu eroare.
  prag_minim_procent: 70
