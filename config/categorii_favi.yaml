# Corecții punctuale după titlu. Au prioritate față de „dupa_type".
# Fiecare intrare: „potrivire" e o expresie regulată căutată în titlu (fără majuscule).
# Ordinea contează: prima potrivire câștigă.
dupa_titlu:
  - potrivire: 'suport\s+umbrel'
    categorie: "Hol > Suporturi umbrelă"
  - potrivire: 'rama\s+iluminatoare'
    categorie: "Living > Mobilă living"
  - potrivire: 'scaun\s+de\s+bar'
    categorie: "Bucătărie > Mobilă de bucătărie > Scaune pentru bar"
  - potrivire: 'canapea'
    categorie: "Living > Canapele"
  - potrivire: 'coltar|colțar'
    categorie: "Living > Canapele"
